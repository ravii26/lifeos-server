# Local development database only. Production stays on Neon.
services:
  postgres:
    image: postgres:16-alpine
    container_name: lifeos_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lifeos
      POSTGRES_PASSWORD: lifeos_dev
      POSTGRES_DB: lifeos
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifeos"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
